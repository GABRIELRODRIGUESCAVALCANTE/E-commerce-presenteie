# nginx do servidor (fora do Docker): recebe o tráfego do domínio e repassa para os containers.
#   https://SEU_DOMINIO/       -> front-end (container na porta 5173)
#   https://SEU_DOMINIO/api/   -> API Express (container na porta 3001)
# Instalação: veja DEPLOY.md. O certbot adiciona o HTTPS automaticamente a este arquivo.
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    # Upload de imagens de produto (a API aceita até 5MB)
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (não acumula) o IP do cliente: os logs de auditoria ficam confiáveis
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
