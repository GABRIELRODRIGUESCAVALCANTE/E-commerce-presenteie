services:
  # Banco de Dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: presenteie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-presenteie}
    # Publicado apenas em localhost: o banco nunca fica exposto na internet
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-presenteie}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (Express + Better Auth)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presenteie-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-presenteie}
      DB_SSL: "false"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET no arquivo .env - gere com openssl rand -hex 32}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@presenteie.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    # Em produção o nginx do servidor faz o proxy de https://seudominio/api para esta porta
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # Frontend SPA (React + Vite servido com Nginx)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # Em produção: https://seudominio.com.br/api (definido no .env)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    container_name: presenteie-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: presenteie_postgres_data
